<title>Best Tarik &amp; Co</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Best Tarik &amp; Co, Johor Bahru. The art of tarik: pulled teh tarik over silky taufufah, crowned with cream.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="preload" as="image" href="a/drink-premium.webp">
<style>
/* Layout: a cinematic scroll. Hero stage (3D cup in caramel light, giant TARIK. behind it) hands off to a swipeable
   drink showcase, then a scroll-scrubbed pour, an editorial story, an asymmetric photo wall, and a tea-brown destination.
   One committed light look; tea-brown is the only dark surface. Mobile (390px) designed first. */
:root{
  --cream:#F5EBDD;
  --cream-2:#EEDFCB;
  --caramel:#E5BD8E;
  --tea:#382219;
  --tea-soft:#6A4B3A;      /* secondary text on cream, 7:1 */
  --tarik:#A95C25;         /* orange for text on cream, 4.6:1 */
  --brand:#E87825;         /* the logo orange, for fills and type on tea-brown */
  --line:rgba(56,34,25,.14);
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --gutter-l:max(20px, env(safe-area-inset-left,0px));
  --gutter-r:max(20px, env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--tea);font:16px/1.65 var(--f-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--cream)}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tarik);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{display:flex;align-items:center;gap:.7rem;font:600 .72rem/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--tea-soft)}
.eyebrow::before{content:"";width:12px;height:7px;background:var(--brand);border-radius:1px;flex:none}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;line-height:.95;text-wrap:balance}
.display em{font-style:italic;color:var(--tarik)}
.lede{color:var(--tea-soft);font-size:1.06rem;line-height:1.75;max-width:52ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(.9rem + env(safe-area-inset-top,0px)) var(--gutter-r) .9rem var(--gutter-l);
  transition:background-color .35s ease,box-shadow .35s ease}
.header.solid{background:color-mix(in srgb,var(--cream) 90%,transparent);box-shadow:0 1px 0 var(--line);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px)}
.logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;min-height:44px}
.logo svg{width:20px;height:28px;flex:none}
.logo span{font:700 .78rem/1 var(--f-body);letter-spacing:.3em;white-space:nowrap}
.logo small{font-size:.56rem;letter-spacing:.14em;margin-left:.1em;color:var(--tea-soft)}
.nav{display:none}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 .9rem;font:500 .86rem/1 var(--f-body);color:var(--tea-soft);text-decoration:none;transition:color .25s ease}
.nav a::after{content:"";position:absolute;left:50%;bottom:6px;width:8px;height:5px;margin-left:-4px;background:var(--brand);border-radius:1px;opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .3s var(--ease-out)}
.nav a.active{color:var(--tea)}
.nav a.active::after{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){.nav a:hover{color:var(--tea)}}
.menu-btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 1rem;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--cream) 70%,transparent);font:600 .78rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:transform .16s var(--ease-out)}
.menu-btn:active{transform:scale(.96)}
.menu-btn i{display:grid;gap:4px}
.menu-btn i::before,.menu-btn i::after{content:"";display:block;width:16px;height:1.5px;background:currentColor;border-radius:1px}
.menu{position:fixed;inset:0;z-index:49;background:var(--tea);color:var(--cream);display:flex;flex-direction:column;justify-content:flex-end;gap:.2rem;
  padding:calc(6rem + env(safe-area-inset-top,0px)) var(--gutter-r) calc(2.4rem + env(safe-area-inset-bottom,0px)) var(--gutter-l);opacity:0;transition:opacity .28s ease}
.menu.open{opacity:1}
.menu a{display:flex;align-items:baseline;gap:1rem;text-decoration:none;font:500 clamp(2.4rem,11vw,3.4rem)/1.1 var(--f-display)}
.menu a span{font:600 .72rem var(--f-body);letter-spacing:.2em;color:var(--brand)}
.menu p{margin-top:1.6rem;font-size:.9rem;color:rgba(245,235,221,.7)}
.header.on-menu .logo,.header.on-menu .menu-btn{color:var(--cream)}
.header.on-menu .menu-btn{background:transparent;border-color:rgba(245,235,221,.3)}
.header.on-menu .logo small{color:rgba(245,235,221,.7)}
@media (min-width:900px){
  .nav{display:flex}
  .menu-btn{display:none}
}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:640px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(120% 70% at 18% 8%, rgba(255,236,206,.95) 0%, rgba(255,236,206,0) 55%),
    radial-gradient(90% 60% at 50% 62%, #EED2AC 0%, rgba(238,210,172,0) 70%),
    linear-gradient(180deg,#F3E2CA 0%, #E9C9A1 58%, #DDB283 100%)}
.liquid{position:absolute;inset:-10%;width:120%;height:120%;z-index:0;pointer-events:none}
.liquid .blob{transform-box:fill-box;transform-origin:center}
.liquid .b1{animation:drift1 38s ease-in-out infinite alternate}
.liquid .b2{animation:drift2 46s ease-in-out infinite alternate}
.liquid .stream-flow{stroke-dasharray:2 34;animation:flow 3.2s linear infinite}
@keyframes drift1{to{transform:translate(4%,3%) rotate(14deg) scale(1.06)}}
@keyframes drift2{to{transform:translate(-5%,-2%) rotate(-12deg) scale(.95)}}
@keyframes flow{to{stroke-dashoffset:-72}}
.hero-light{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,244,226,.55) 0%,rgba(255,244,226,0) 38%),radial-gradient(70% 45% at 50% 100%,rgba(56,34,25,.28),rgba(56,34,25,0) 70%)}
.hero-word{position:absolute;left:0;right:0;top:31%;z-index:2;text-align:center;pointer-events:none;
  font:500 clamp(6.4rem,30vw,22rem)/.8 var(--f-display);letter-spacing:-.03em;color:var(--tea);transform:translateY(-50%)}
.hero-word .ch{display:inline-block}
.hero-word .dot{color:var(--brand)}
.hero-top{position:absolute;z-index:4;left:var(--gutter-l);right:var(--gutter-r);top:calc(5.6rem + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.hero-kicker{font:500 clamp(1.4rem,6.4vw,2.6rem)/1 var(--f-display);letter-spacing:.02em}
.hero-kicker em{font-style:italic;color:var(--tarik)}
.hero-place{font:600 .66rem/1.5 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--tea-soft);text-align:right}
.cup-stage{position:absolute;inset:0;z-index:3;pointer-events:none}
.cup-float{position:absolute;inset:0;animation:bob 7s ease-in-out infinite}
.cup-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.cup-stage .poster{position:absolute;left:50%;top:60%;height:44%;width:auto;max-width:none;transform:translate(-50%,-50%);transition:opacity .6s ease}
.cup-stage.ready .poster{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.drops{position:absolute;inset:0;z-index:3;pointer-events:none}
.drop{position:absolute;width:10px;height:14px;opacity:0;animation:fall 7s ease-in infinite}
.drop svg{width:100%;height:100%}
.drop:nth-child(1){left:22%;top:18%;animation-delay:.6s}
.drop:nth-child(2){left:76%;top:24%;animation-delay:3.1s;width:8px;height:11px}
.drop:nth-child(3){left:64%;top:12%;animation-delay:5.2s}
.drop:nth-child(4){left:34%;top:30%;animation-delay:4.2s;width:7px;height:10px}
@keyframes fall{0%{opacity:0;transform:translateY(0)}12%{opacity:.75}70%{opacity:.6}100%{opacity:0;transform:translateY(46vh)}}
.hero-bottom{position:absolute;z-index:4;left:var(--gutter-l);right:var(--gutter-r);bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:1.1rem;text-align:center}
.hero-sub{font:italic 400 clamp(1.15rem,4.6vw,1.6rem)/1.3 var(--f-display);max-width:22ch}
.scroll-cue{display:grid;justify-items:center;gap:.5rem;font:600 .62rem var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--tea-soft);text-decoration:none;min-height:44px}
.scroll-cue i{position:relative;width:1px;height:34px;background:rgba(56,34,25,.2);overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;left:-1px;top:-12px;width:3px;height:12px;border-radius:2px;background:var(--brand);animation:cue 2.2s var(--ease-out) infinite}
@keyframes cue{to{transform:translateY(48px)}}
@media (max-width:420px){.drop:nth-child(n+3){display:none}}
@media (min-width:900px){
  .hero{min-height:720px}
  .hero-word{top:47%}
  .cup-stage .poster{top:52%;height:66%}
  .hero-top{top:calc(7rem + env(safe-area-inset-top,0px))}
  .hero-bottom{left:auto;right:var(--gutter-r);justify-items:end;text-align:right;bottom:3rem}
  .hero-sub{max-width:16ch}
  .scroll-cue{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%)}
  .hero-bottom .scroll-cue{position:absolute;right:auto;left:50%;bottom:-1.4rem;transform:none;margin-left:calc(-50vw + var(--gutter-r))}
}

/* ---------- signature drinks ---------- */
.drinks{position:relative;--bg:#E5BD8E;background:var(--bg);transition:background-color .8s ease;padding-block:clamp(72px,10vw,120px) clamp(48px,7vw,96px);overflow:hidden}
.drinks-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.2rem 2rem}
.drinks-head h2{font-size:clamp(2.8rem,11vw,5.6rem);margin-top:1rem}
.count{font:500 1.05rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.count b{font-weight:600;font-size:1.6rem}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-top:clamp(28px,4vw,44px);list-style:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;display:grid;justify-items:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.slide-word{position:absolute;top:10%;left:0;right:0;text-align:center;font:500 clamp(5rem,24vw,15rem)/.8 var(--f-display);letter-spacing:-.03em;color:rgba(56,34,25,.08);pointer-events:none;white-space:nowrap}
.slide figure{position:relative;width:min(78vw,440px);aspect-ratio:3/4;display:grid;place-items:end center}
.slide figure::after{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(56,34,25,.32),rgba(56,34,25,0));z-index:0}
.slide img{position:relative;z-index:1;width:auto;height:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 26px 30px rgba(56,34,25,.28))}
.slide-text{position:relative;display:grid;justify-items:center;text-align:center;gap:.5rem;margin-top:1.6rem;max-width:30ch}
.slide-text .no{font:600 .7rem var(--f-body);letter-spacing:.24em;color:var(--tea-soft)}
.slide-text h3{font:500 clamp(2.2rem,9vw,3.6rem)/1 var(--f-display)}
.slide-text p{font:italic 400 1.15rem/1.4 var(--f-display);color:var(--tea)}
.slide-text .layers{font:600 .66rem/1.6 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--tea-soft)}
.drinks-ctrl{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:clamp(24px,4vw,36px)}
.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(56,34,25,.25);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background-color .25s ease,transform .16s var(--ease-out),opacity .25s ease}
.arrow svg{width:18px;height:18px}
.arrow:active{transform:scale(.94)}
.arrow:disabled{opacity:.3;cursor:default}
@media (hover:hover) and (pointer:fine){.arrow:not(:disabled):hover{background:rgba(56,34,25,.08)}}
.dots{display:flex;gap:.2rem}
.dots button{width:36px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.dots button i{display:block;width:22px;height:3px;border-radius:2px;background:rgba(56,34,25,.22);transition:background-color .3s ease,width .3s var(--ease-out)}
.dots button[aria-current="true"] i{background:var(--tea);width:30px}
.swipe-hint{text-align:center;font:600 .62rem var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--tea-soft);margin-top:.8rem}
@media (min-width:900px){
  .slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;justify-items:stretch;gap:4vw}
  .slide figure{justify-self:end;width:min(40vw,520px)}
  .slide-text{justify-items:start;text-align:left;margin-top:0;max-width:34ch}
  .slide-word{top:50%;transform:translateY(-50%)}
  .swipe-hint{display:none}
}

/* ---------- the art of tarik ---------- */
.art-intro{padding-block:clamp(88px,13vw,170px) clamp(48px,7vw,80px)}
.art-intro h2{font-size:clamp(3.2rem,13vw,8.6rem);line-height:.9;margin-top:1.2rem}
.art-intro h2 .w{display:inline-block}
.art-intro .lede{margin-top:1.6rem}
.scrub{position:relative;height:320vh}
.scrub-sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#EAD9C1}
.scrub video{position:absolute;left:0;right:0;top:0;width:100%;height:64%;object-fit:cover;object-position:50% 70%}
.scrub-sticky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:var(--tea);z-index:0}
.scrub-shade{position:absolute;left:0;right:0;top:0;height:64%;background:linear-gradient(180deg,rgba(56,34,25,0) 70%,rgba(56,34,25,.9) 100%);pointer-events:none;z-index:1}
.beats{position:absolute;z-index:2;left:var(--gutter-l);right:var(--gutter-r);bottom:calc(2rem + env(safe-area-inset-bottom,0px));list-style:none;color:var(--cream);min-height:9.5rem}
.beat{position:absolute;left:0;right:0;bottom:0;display:grid;gap:.4rem;opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .5s var(--ease-out)}
.beat.on{opacity:1;transform:none}
.beat span{font:600 .7rem var(--f-body);letter-spacing:.24em;color:var(--brand)}
.beat h3{font:500 clamp(2.2rem,9vw,4.4rem)/1 var(--f-display)}
.beat p{max-width:36ch;color:rgba(245,235,221,.86);font-size:.98rem}
.scrub-bar{position:absolute;z-index:2;left:var(--gutter-l);right:var(--gutter-r);top:calc(5.2rem + env(safe-area-inset-top,0px));height:2px;background:rgba(56,34,25,.15);border-radius:2px}
.scrub-bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:var(--brand);border-radius:2px}
@media (min-width:900px){.scrub video{height:100%;object-position:50% 50%}.scrub-sticky::after{display:none}.beats{left:auto;right:var(--gutter-r);width:min(440px,40vw);bottom:4rem}.scrub-shade{height:100%;background:linear-gradient(90deg,rgba(56,34,25,0) 45%,rgba(56,34,25,.62) 100%)}}

/* ---------- our story ---------- */
.story{padding-block:clamp(96px,13vw,170px)}
.story-head h2{font-size:clamp(3rem,12vw,7rem);margin-top:1.2rem}
.story-grid{display:grid;gap:clamp(40px,6vw,80px);margin-top:clamp(44px,6vw,80px)}
.story-row{display:grid;gap:1.4rem;align-items:center}
.story-row .ph{position:relative;overflow:hidden;border-radius:2px}
.story-row .ph img{width:100%;height:100%;object-fit:cover}
.story-row h3{font:500 clamp(1.9rem,7vw,2.8rem)/1.05 var(--f-display)}
.story-row .txt{display:grid;gap:.9rem}
.story-row .txt p{color:var(--tea-soft);line-height:1.75}
.tall{aspect-ratio:4/5}
.wide{aspect-ratio:5/4}
.todo{position:relative;display:grid;place-items:center;text-align:center;gap:.4rem;padding:24px;border:1.5px dashed rgba(56,34,25,.3);background:repeating-linear-gradient(135deg,rgba(56,34,25,.035) 0 10px,transparent 10px 20px);color:var(--tea-soft);font-size:.86rem;line-height:1.5}
.todo b{font:600 .66rem var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--tarik)}
.todo-text{border-left:2px dashed rgba(169,92,37,.5);padding-left:1rem;color:var(--tea-soft);font-style:italic}
.milestones{list-style:none;display:grid;gap:0;margin-top:.6rem;border-top:1px solid var(--line)}
.milestones li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line);font-size:.95rem;color:var(--tea-soft)}
.milestones li span{font:500 1.1rem var(--f-display);color:var(--tarik)}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prep figure{position:relative}
.prep img{width:100%;aspect-ratio:1;object-fit:cover}
.prep figcaption{font:600 .62rem/1.4 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--tea-soft);margin-top:.5rem}
@media (min-width:900px){
  .story-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6vw}
  .story-row.flip .ph,.story-row.flip .todo{order:2}
  .prep{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ---------- highlights ---------- */
.high{background:var(--cream-2);padding-block:clamp(96px,13vw,160px)}
.high h2{font-size:clamp(2.8rem,11vw,6rem);margin-top:1.2rem}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:clamp(40px,6vw,72px);grid-auto-flow:dense}
.wall figure{position:relative;overflow:hidden;background:#E6D3BB;min-width:0}
.wall img{width:100%;height:100%;object-fit:cover}
.wall .cut{background:linear-gradient(180deg,#EAD2B0,#D9B48A);display:grid;place-items:end center;padding-top:14%}
.wall .cut img{width:auto;height:100%;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(56,34,25,.25))}
.wall figcaption{position:absolute;left:10px;bottom:10px;font:600 .58rem/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;background:rgba(245,235,221,.88);color:var(--tea);padding:6px 8px}
.w-a{grid-column:span 2;aspect-ratio:4/3}
.w-b{aspect-ratio:3/4}
.w-c{aspect-ratio:3/4}
.w-d{aspect-ratio:1}
.w-e{aspect-ratio:1}
.w-f{grid-column:span 2;aspect-ratio:16/9}
.w-g{aspect-ratio:3/4}
.w-h{aspect-ratio:3/4}
@media (min-width:900px){
  .wall{grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
  .w-a{grid-column:1 / span 7;grid-row:span 2;aspect-ratio:auto;min-height:620px}
  .w-b{grid-column:8 / span 5;aspect-ratio:5/4}
  .w-c{grid-column:8 / span 2;aspect-ratio:auto}
  .w-d{grid-column:10 / span 3;aspect-ratio:auto}
  .w-e{grid-column:1 / span 3;aspect-ratio:1}
  .w-f{grid-column:4 / span 6;aspect-ratio:auto}
  .w-g{grid-column:10 / span 3;aspect-ratio:3/4}
  .w-h{display:none}
}

/* ---------- find us ---------- */
.find{background:var(--tea);color:var(--cream);padding-block:clamp(96px,13vw,170px) calc(48px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
.find::before{content:"";position:absolute;right:-30%;top:-20%;width:90vmax;height:90vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(232,120,37,.22),rgba(232,120,37,0));pointer-events:none}
.find .eyebrow{color:rgba(245,235,221,.72)}
.find h2{font-size:clamp(3.4rem,15vw,9rem);margin-top:1.2rem;color:var(--cream)}
.find h2 em{color:var(--brand)}
